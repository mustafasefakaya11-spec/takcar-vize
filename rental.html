<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>TakCar - Araç Filosu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #07090e; color: #f8fafc; }
        header { background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(12px); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: #94a3b8; text-decoration: none; margin-left: 1rem; font-weight: 500; font-size: 0.9rem; }
        nav a:hover, nav a.active { color: #38bdf8; }

        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .page-header { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
        .title { font-size: 1.5rem; font-weight: 800; }
        
        .filter-tags { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
        .tag { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; padding: 0.35rem 0.85rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
        .tag.active { background: #38bdf8; color: #07090e; border-color: #38bdf8; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
        .card { background: rgba(18, 24, 38, 0.85); border: 1px solid rgba(255,255,255,0.07); border-radius: 1rem; overflow: hidden; position: relative; }
        .badge { position: absolute; top: 0.75rem; right: 0.75rem; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 700; z-index: 2; }
        
        .card img { width: 100%; height: 180px; object-fit: cover; background: #0b0f19; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-body { padding: 1.25rem; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; color: #fff; }
        
        .specs { display: flex; gap: 0.75rem; color: #94a3b8; font-size: 0.8rem; margin-bottom: 1.25rem; }
        .price-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.85rem; }
        .price { font-size: 1.15rem; font-weight: 800; color: #38bdf8; }
        .price small { font-size: 0.7rem; color: #94a3b8; font-weight: normal; }
        
        .rent-btn { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #07090e; padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚗 TakCar</div>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="rental.html" class="active">Filo</a>
            <a href="profile.html">Profil</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2 class="title">Araç Filosu</h2>
            <div class="filter-tags">
                <span class="tag active">Tümü</span>
                <span class="tag">Otomatik</span>
                <span class="tag">Yakındakiler</span>
            </div>
        </div>

        <div class="grid">
            <!-- Clio -->
            <div class="card">
                <div class="badge">📍 1.2 km</div>
                <img src="clio.png" alt="Clio">
                <div class="card-body">
                    <div class="card-title">Renault Clio 1.0 TCe</div>
                    <div class="specs"><span>⚡ Otomatik</span><span>⛽ Benzin</span></div>
                    <div class="price-row">
                        <div class="price">120 TL <small>/ dk</small></div>
                        <button class="rent-btn" onclick="alert('Kilit açılıyor!')">Kirala</button>
                    </div>
                </div>
            </div>
            <!-- i20 -->
            <div class="card">
                <div class="badge">📍 450 m</div>
                <img src="i20.png" alt="i20">
                <div class="card-body">
                    <div class="card-title">Hyundai i20 1.0 T-GDi</div>
                    <div class="specs"><span>⚡ DCT Vites</span><span>⛽ Benzin</span></div>
                    <div class="price-row">
                        <div class="price">135 TL <small>/ dk</small></div>
                        <button class="rent-btn" onclick="alert('Kilit açılıyor!')">Kirala</button>
                    </div>
                </div>
            </div>
            <!-- BMW -->
            <div class="card">
                <div class="badge">📍 2.5 km</div>
                <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80" alt="BMW">
                <div class="card-body">
                    <div class="card-title">BMW 316i E90</div>
                    <div class="specs"><span>⚡ Stage 1</span><span>⛽ Benzin</span></div>
                    <div class="price-row">
                        <div class="price">190 TL <small>/ dk</small></div>
                        <button class="rent-btn" onclick="alert('Kilit açılıyor!')">Kirala</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
